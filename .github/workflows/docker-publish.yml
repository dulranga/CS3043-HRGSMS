name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Migrations ship inside the backend image (invoked as
          # `node backend/dist/migrations/cli.js`), so there is no separate
          # migrations image to build here.
          - name: skynest-backend
            dockerfile: backend/Dockerfile
          - name: skynest-frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # GitHub repo names can contain uppercase letters, but Docker image names
      # must be lowercase, so normalise the full path here. The value is emitted
      # as a step output because GITHUB_ENV values are not visible to the
      # `${{ env.* }}` context used by the build step below.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Publish a multi-arch manifest so Apple Silicon (arm64) and x86_64
          # hosts both pull a native image.
          platforms: linux/amd64,linux/arm64
          push: true
          # `latest` plus an immutable per-commit tag.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer caching shared across runs (scoped per image so the two
          # matrices never clobber each other).
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-containers:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for the OIDC token that azure/login exchanges for an Azure
      # access token (federated identity / workload identity federation).
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: skynest-backend
            container-app: ${{ vars.AZURE_CONTAINER_APP_BACKEND }}
          - name: skynest-frontend
            container-app: ${{ vars.AZURE_CONTAINER_APP_FRONTEND }}

    steps:
      - name: Azure login (OIDC federated identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Redeploy ${{ matrix.name }} container app
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ matrix.container-app }}
        run: |
          set -euo pipefail

          if [ -z "${CONTAINER_APP}" ] || [ -z "${RESOURCE_GROUP}" ]; then
            echo "::error::Set the repository variables AZURE_RESOURCE_GROUP and AZURE_CONTAINER_APP_BACKEND / AZURE_CONTAINER_APP_FRONTEND before deploying."
            exit 1
          fi

          # GitHub repo names may contain uppercase letters; the image path must
          # be lowercase (matches the tag pushed by the build job).
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}:${GITHUB_SHA}"
          echo "Deploying ${image} to container app ${CONTAINER_APP} (${RESOURCE_GROUP})"

          # Updating the image creates (and, in single-revision mode, activates)
          # a new revision — i.e. a redeploy.
          az containerapp update \
            --name "${CONTAINER_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${image}" \
            --query "properties.latestRevisionName" \
            --output tsv
