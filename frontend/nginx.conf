server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TanStack Router uses history routing, so deep links such as /bookings/:id
    # must fall back to index.html rather than 404 at the static host.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API traffic to the Express backend container. Keeping this on the
    # same origin means the browser's HTTP-only, SameSite=strict session cookie
    # is sent and received without any CORS/cross-site configuration.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived cache for content-hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
