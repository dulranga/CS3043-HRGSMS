version: '3.8'

services:
  frontend:
    image: ghcr.io/dulranga/cs3043-hrgsms/skynest-frontend:latest
    ports:
      - "8080:4173"
    environment:
      - VITE_BACKEND_URL=http://backend:4000
      - VITE_ALLOWED_HOSTS=.azurewebsites.net 

  backend:
    image: ghcr.io/dulranga/cs3043-hrgsms/skynest-backend:latest
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SESSION_COOKIE_SECURE=true
      - SESSION_ABSOLUTE_HOURS=12 

  migrate:
    image: ghcr.io/dulranga/cs3043-hrgsms/skynest-backend:latest
    command: ["node", "backend/dist/migrations/cli.js"]
 