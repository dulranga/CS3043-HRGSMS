# SkyNest HRGSMS — full local stack.
#
#   cp .env.example .env      # then set SESSION_SECRET
#   docker compose up
#
# App images are pulled from GitHub Container Registry (built and pushed by
# .github/workflows/docker-publish.yml). Run `docker compose pull` to refresh
# the `:latest` tags. Override BACKEND_IMAGE / FRONTEND_IMAGE in .env to pin a
# tag or use a locally built image.
#
# Open http://localhost:8080 for the SPA; it reverse-proxies /api to the
# backend so the session cookie stays on one origin. Postgres 18 is required
# because every primary key defaults to the native uuidv7() function.
name: skynest-hrgsms

# Reused by the backend image, the one-shot migration runner and the seeder so
# every backend-based service runs the exact same image.
x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/dulranga/cs3043-hrgsms/skynest-backend:latest}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skynest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skynest}
      POSTGRES_DB: ${POSTGRES_DB:-skynest_hrgsms}
    ports:
      # Host access for a local psql/client. Change POSTGRES_PORT if 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql and
      # create their own major-version subdirectory beneath it.
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-skynest} -d ${POSTGRES_DB:-skynest_hrgsms}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies backend/migrations once, before the app starts. Re-running is safe:
  # the runner skips versions already recorded in schema_migrations.
  migrate:
    <<: *backend
    restart: "no"
    command: ["node", "backend/dist/migrations/cli.js"]
    environment:
      PG_URL: postgresql://${POSTGRES_USER:-skynest}:${POSTGRES_PASSWORD:-skynest}@db:5432/${POSTGRES_DB:-skynest_hrgsms}
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "4000"
      PG_URL: postgresql://${POSTGRES_USER:-skynest}:${POSTGRES_PASSWORD:-skynest}@db:5432/${POSTGRES_DB:-skynest_hrgsms}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — copy .env.example to .env and set it (openssl rand -hex 32)}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dulranga/cs3043-hrgsms/skynest-frontend:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional demonstration data (idempotent). Run explicitly:
  #   docker compose --profile seed run --rm seed
  seed:
    <<: *backend
    profiles: ["seed"]
    restart: "no"
    command: ["node", "backend/dist/seed/cli.js"]
    environment:
      PG_URL: postgresql://${POSTGRES_USER:-skynest}:${POSTGRES_PASSWORD:-skynest}@db:5432/${POSTGRES_DB:-skynest_hrgsms}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
